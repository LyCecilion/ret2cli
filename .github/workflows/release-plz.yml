name: Release-plz

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  release-plz-release:
    name: Release-plz release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Calculate the release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Build and publish GitHub Release artifacts
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          if ! jq -e 'length == 1 and .[0].package_name == "ret2cli" and (.[0].tag | length > 0)' <<<"$RELEASES" >/dev/null; then
            echo "Expected exactly one ret2cli release, got: $RELEASES" >&2
            exit 1
          fi
          tag="$(jq -r '.[0].tag' <<<"$RELEASES")"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag"

  release-plz-pr:
    name: Release-plz PR
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare the next release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
