[package]
name = "ret2cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["LyCecilion <LyCecilion@outlook.com>"]
description = "CLI client for Ret2Shell CTF platform"
license = "MIT"
repository = "https://github.com/LyCecilion/ret2cli"
readme = "README.md"
keywords = ["cli", "ret2shell", "ctf"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tabled = "0.18"
termimad = "0.31"
colored = "3"
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17"
hex = "0.4"
dirs = "6"
rpassword = "7"
dialoguer = "0.11"
indicatif = "0.17"
futures-util = "0.3"
clap_complete = "4"
rustyline = { version = "16", default-features = false }
shell-words = "1"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "warn"
